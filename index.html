<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- KakaoTalk In-App Browser Auto-Escape to Chrome / Safari -->
    <script>
      (function() {
        var ua = navigator.userAgent || '';
        if (/KAKAOTALK/i.test(ua)) {
          var url = window.location.href;
          if (/iPhone|iPad|iPod/i.test(ua)) {
            // iOS: Open in Safari via Kakao's external browser scheme
            window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
          } else if (/Android/i.test(ua)) {
            // Android: Open in Chrome via Android Intent
            var cleanUrl = url.replace(/^https?:\/\//i, '');
            window.location.href = 'intent://' + cleanUrl + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.android.chrome;end';
          }
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/symbol.png" />
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="부광고등학교 2학년 1반 공지, 일정, 급식, 건의함, 학급 도구 플랫폼" />

    <!-- Apple Touch Icons & iOS Web App Support -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="부광이일" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Android & Generic PWA Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="부광이일" />
    <title>부광이일 - 2학년 1반</title>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
